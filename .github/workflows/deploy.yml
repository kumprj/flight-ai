name: Deploy SST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # These variables must be set in your GitHub Repository Secrets
      GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
      TWILIO_SID: ${{ secrets.TWILIO_SID }}
      TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      MY_PHONE_NUMBER: ${{ secrets.MY_PHONE_NUMBER }}
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      # Optional: Vite environment variables (if you plan to deploy the frontend here later)
      VITE_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # We recommend OpenID Connect (OIDC) instead of static keys for production,
          # but for a quick setup, use long-lived IAM keys stored as GitHub secrets.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change this if your AWS region is different

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Deploy SST to Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx sst deploy --stage production
